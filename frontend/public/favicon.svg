<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Plately">
  <!-- A plate, drawn simply enough to still read at 16px: brand green ground,
       white rim, mint centre. The colours are the theme's primary (#0b6444)
       and primary-fixed (#a4f3c9) from tailwind.config.js. -->
  <rect width="64" height="64" rx="14" fill="#0b6444"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="32" cy="32" r="8.5" fill="#a4f3c9"/>
</svg>

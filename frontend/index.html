<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Plately — Photograph a meal, know what's in it</title>
    <meta
      name="description"
      content="Point your camera at a meal and Plately names it and logs its calories and macros — including Nigerian dishes like jollof, amala, eba, egusi, moi moi and pounded yam."
    />
    <meta name="theme-color" content="#0b6444" />

    <!-- Icons. The SVG scales and is preferred where supported; the PNGs are
         for Safari and for anything that will not take an SVG. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews. WhatsApp, Slack, iMessage and Facebook all read these.
         og:image MUST be an absolute URL — a relative path silently produces
         a preview with no image, which is the usual reason a shared link looks
         blank. Update the two absolute URLs below if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plately" />
    <meta property="og:title" content="Plately — Photograph a meal, know what's in it" />
    <meta
      property="og:description"
      content="Point your camera at a meal and Plately names it and logs its calories and macros — including Nigerian dishes like jollof, amala, eba, egusi, moi moi and pounded yam."
    />
    <meta property="og:url" content="https://plately-project.netlify.app/" />
    <meta property="og:image" content="https://plately-project.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Plately — photograph a meal, know what's in it" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plately — Photograph a meal, know what's in it" />
    <meta
      name="twitter:description"
      content="Point your camera at a meal and Plately names it and logs its calories and macros — including Nigerian dishes like jollof, amala, eba, egusi, moi moi and pounded yam."
    />
    <meta name="twitter:image" content="https://plately-project.netlify.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
